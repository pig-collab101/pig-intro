body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px}

.stat b{display:block;font-size:20px}

.legend{display:flex;flex-wrap:wrap;gap:10px;color:var(--sub);font-size:12px}

.side{width:320px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:12px;max-height:78vh;overflow:auto}

svg{display:block}
.n{cursor:pointer}
.n rect{stroke:none}
.n text{font-size:12px;fill:#fff;font-weight:600;pointer-events:none}
.n.dim{opacity:.13}
.n.sel rect{stroke:var(--ink);stroke-width:2.5}
.n.gone rect{fill:var(--panel)!important;stroke:var(--gone);stroke-width:1.5;stroke-dasharray:3 2}
.n.gone text{fill:var(--gone);text-decoration:line-through}
.n.boom rect{stroke:var(--boom);stroke-width:3}
.e{fill:none;stroke-width:1.4;opacity:.75}
.e.prey{stroke:var(--prey)}
.e.pred{stroke:var(--pred)}
.e.all{stroke:var(--sub);opacity:.07;stroke-width:1}
.bandbg{fill:var(--band)}
.bandlbl{fill:var(--sub);font-size:12px;font-weight:600}
.colhd{fill:var(--ink);font-size:14px;font-weight:700}
.colsep{stroke:var(--line)}
.side h2{margin:0 0 2px;font-size:20px}
.side .meta{color:var(--sub);margin-bottom:12px}
.side h3{font-size:13px;margin:14px 0 6px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:3px 9px;border-radius:12px;font-size:12px;color:#fff;cursor:pointer;border:none}
.warn{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--band);font-size:12.5px;line-height:1.5}
.empty{color:var(--sub);line-height:1.6}
.muted{color:var(--sub);font-size:12px}

</div>
<div class="wrap">

</div>

const RARITY = {};

const N = {};

});

const errors = [];

animals.forEach(a => a.rarity = RARITY[a.name] || '일반');

function drawAnimal() {
  let roll = Math.random() * 100;
  for (const [r, pct] of RARITY_DEF) {
    if ((roll -= pct) < 0 || r === '일반') {
      const list = byRarity[r];
      return list[Math.floor(Math.random() * list.length)];
    }
  }
}
const rarityTag = r => `<span style="color:${RARITY_INFO[r].color};font-weight:700">${r}</span>`;

// 영양 단계: 생산자=1, 동물=1+먹이 단계 평균

for (let i = 0; i < 100; i++) animals.forEach(a => {

  a.lvl = 1 + ps.reduce((s, p) => s + N[p].lvl, 0) / ps.length;
});
const bandOf = n => n.basal ? 0 : n.lvl < 2.4 ? 1 : n.lvl < 3.2 ? 2 : 3;
const BANDS = ['생산자·자원', '1차 소비자', '2차 소비자', '3차 이상'];

  [animals.length + '종', '동물'],

  [noPred.length + '종', '천적이 없는 종'],
  [oneFood.length + '종', '먹이가 1종뿐인 종'],
  [errors.length ? errors.length + '개 ⚠' : '0개 ✓', '잘못된 연결'],
].map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('')
+ RARITY_DEF.map(([r, pct, color]) => {
  const n = byRarity[r].length;
  return `<div class="stat"><b style="color:${color}">${r} ${n}종</b><span>등급 ${pct}% · 한 종당 ${(pct / n).toFixed(2)}%</span></div>`;
}).join('');
document.getElementById('names').innerHTML = Object.keys(N).map(n => `<option value="${n}">`).join('');

// ---- 배치 ----
const LEFT = 92, COLW = 210, PAD = 10, ROWH = 28, PILLH = 22, TOP = 40;
const W = LEFT + COLW * BIOMES.length + 10;
const pillW = s => s.length * 13 + 18;
function flow(list, x0, width) { // 한 칸 안에 줄바꿈 배치, 행 수 반환
  let x = x0 + PAD, row = 0;
  list.forEach(n => {
    const w = pillW(n.name);
    if (x + w > x0 + width - PAD) { x = x0 + PAD; row++; }
    n.w = w; n.rx = x; n.row = row; x += w + 6;
  });
  return list.length ? row + 1 : 0;
}
const sortL = (a, b) => b.lvl - a.lvl || a.name.localeCompare(b.name);
let y = TOP;
const bandY = [];
for (const band of [3, 2, 1]) {
  let rows = 1;
  BIOMES.forEach(([b], i) => {
    const list = animals.filter(a => a.biome === b && bandOf(a) === band).sort(sortL);
    rows = Math.max(rows, flow(list, LEFT + i * COLW, COLW));
    list.forEach(n => { n.x = n.rx; n.y = y + 8 + n.row * ROWH; });
  });
  const h = rows * ROWH + 16;
  bandY.push([band, y, h]); y += h + 6;
}
const basal = BASAL.map(b => N[b]);
const bRows = flow(basal, LEFT, W - LEFT);
basal.forEach(n => { n.x = n.rx; n.y = y + 8 + n.row * ROWH; });
bandY.push([0, y, bRows * ROWH + 16]); y += bRows * ROWH + 26;
const H = y;

BIOMES.forEach(([b, label], i) => {

});
svg += `<g id="edges"></g><g id="nodes">`;
Object.values(N).forEach(n => {
  svg += `<g class="n" data-n="${n.name}" transform="translate(${n.x},${n.y})"><rect width="${n.w}" height="${PILLH}" rx="11" fill="${DIET_COLOR[n.diet]}"/><text x="${n.w / 2}" y="15" text-anchor="middle">${n.name}</text></g>`;
});

const path = (a, b) => { // a(포식자) → b(먹이)
  const x1 = a.x + a.w / 2, y1 = a.y + PILLH, x2 = b.x + b.w / 2, y2 = b.y;
  const dy = Math.max(30, Math.abs(y2 - y1) / 2);
  return `M${x1},${y1} C${x1},${y1 + dy} ${x2},${y2 - dy} ${x2},${y2}`;
};
const edgesEl = document.getElementById('edges');
let showAll = false, selected = null;

function drawEdges() {
  let s = '';

  if (selected) {
    const n = N[selected];
    n.prey.forEach(p => s += `<path class="e prey" d="${path(n, N[p])}"/>`);

  }

}
const chip = name => `<button class="chip" style="background:${DIET_COLOR[N[name].diet]}" data-go="${name}">${name}</button>`;

function select(name) {
  if (!N[name]) return;
  clearExt();
  selected = name;
  const n = N[name];
  const near = new Set([name, ...n.prey, ...n.pred]);
  Object.entries(elOf).forEach(([k, g]) => {
    g.classList.toggle('dim', !near.has(k));
    g.classList.toggle('sel', k === name);
  });
  drawEdges();
  const warns = [];
  if (!n.basal && n.prey.length === 1) warns.push(`⚠ 먹이가 <b>${n.prey[0]}</b> 하나뿐이에요. 그 먹이가 줄면 바로 위험해져요.`);
  if (!n.basal && n.pred.length === 0) warns.push('👑 천적이 없어요. 게임에서는 수명·영역 다툼·질병으로 수를 조절해야 해요.');
  if (n.pred.length >= 6) warns.push(`🎯 천적이 ${n.pred.length}종이나 돼요. 번식이 빨라야 살아남아요.`);
  document.getElementById('side').innerHTML = `
    <h2>${name}</h2>
    <div class="meta">${n.basal ? '생산자·자원' : rarityTag(n.rarity) + ' · ' + BIOME_LABEL[n.biome] + ' · ' + n.diet}${n.basal ? '' : ` · 영양 단계 ${n.lvl.toFixed(1)}`}</div>
    ${n.basal ? '' : `<h3>🍽 먹이 (${n.prey.length})</h3><div class="chips">${n.prey.map(chip).join('')}</div>`}

    <div class="chips">${n.pred.length ? n.pred.map(chip).join('') : '<span class="muted">없음</span>'}</div>
    ${warns.map(w => `<div class="warn">${w}</div>`).join('')}`;
  document.getElementById('extBtn').disabled = n.basal;
  elOf[name].scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
}

function clearExt() {
  Object.values(elOf).forEach(g => g.classList.remove('gone', 'boom'));
}
function extinction() {
  if (!selected || N[selected].basal) return;
  const gone = new Set([selected]);
  let changed = true;
  while (changed) {
    changed = false;
    animals.forEach(a => {
      if (!gone.has(a.name) && a.prey.every(p => gone.has(p))) { gone.add(a.name); changed = true; }
    });
  }
  const boom = animals.filter(a => !gone.has(a.name) && a.pred.length && a.pred.every(p => gone.has(p)));
  const weak = animals.filter(a => !gone.has(a.name) && a.prey.some(p => gone.has(p)) && !boom.includes(a));
  Object.entries(elOf).forEach(([k, g]) => {
    g.classList.remove('sel');
    g.classList.toggle('gone', gone.has(k));
    g.classList.toggle('boom', boom.some(b => b.name === k));
    g.classList.toggle('dim', !gone.has(k) && !boom.some(b => b.name === k) && !weak.some(w => w.name === k));
  });
  edgesEl.innerHTML = '';
  const lost = [...gone].filter(x => x !== selected);
  document.getElementById('side').innerHTML = `
    <h2>${selected} 멸종 시뮬레이션</h2>
    <div class="meta">먹이가 전부 사라진 종은 함께 멸종해요.</div>
    <h3>💀 함께 멸종 (${lost.length})</h3>
    <div class="chips">${lost.length ? lost.map(chip).join('') : '<span class="muted">없음. 다른 먹이로 버틸 수 있어요.</span>'}</div>
    <h3>📈 천적이 사라져 폭증 위험 (${boom.length})</h3>
    <div class="chips">${boom.length ? boom.map(b => chip(b.name)).join('') : '<span class="muted">없음</span>'}</div>
    <h3>😟 먹이가 줄어드는 종 (${weak.length})</h3>
    <div class="chips">${weak.length ? weak.map(b => chip(b.name)).join('') : '<span class="muted">없음</span>'}</div>
    <div class="warn">그래프에서 <b style="color:var(--gone)">점선</b>은 멸종, <b style="color:var(--boom)">보라 테두리</b>는 폭증 위험이에요.</div>`;
}

function reset() {
  selected = null; clearExt();
  Object.values(elOf).forEach(g => g.classList.remove('dim', 'sel'));
  drawEdges();
  document.getElementById('extBtn').disabled = true;
  document.getElementById('q').value = '';
}

document.getElementById('nodes').addEventListener('click', e => {
  const g = e.target.closest('.n'); if (g) select(g.dataset.n);
});
document.getElementById('side').addEventListener('click', e => {
  const c = e.target.closest('[data-go]'); if (c) select(c.dataset.go);
});
document.getElementById('q').addEventListener('change', e => select(e.target.value.trim()));
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') select(e.target.value.trim()); });
document.getElementById('allBtn').addEventListener('click', e => {
  showAll = !showAll; e.target.classList.toggle('on', showAll); drawEdges();
});
document.getElementById('extBtn').addEventListener('click', extinction);
document.getElementById('resetBtn').addEventListener('click', reset);
document.getElementById('drawBtn').addEventListener('click', () => {
  const a = drawAnimal();
  select(a.name);
  document.getElementById('side').insertAdjacentHTML('afterbegin',
    `<div class="warn" style="margin:0 0 12px">🎲 입장! 이번 생은 ${rarityTag(a.rarity)} <b>${a.name}</b>입니다.</div>`);
});
</script>
</body>
</html>
