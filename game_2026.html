<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>2026 ✈️ 세계 비행기 슈팅</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#070c18;color:#fff;font-family:'Jua','Malgun Gothic',sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;word-break:keep-all}
#wrap{position:absolute;width:480px;height:720px;transform-origin:0 0;overflow:hidden;background:#000;box-shadow:0 0 40px #000}
#cv{position:absolute;inset:0;width:480px;height:720px;display:block}
button{font-family:inherit;cursor:pointer;border:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center}
.screen.on{display:flex}

/* 타이틀 */
#title{justify-content:center;gap:14px;background:linear-gradient(#0008,#0004 40%,#0009)}
#title h1{font-family:'Black Han Sans',sans-serif;font-size:130px;line-height:1;letter-spacing:4px;
  background:linear-gradient(#fff,#9fd3ff 55%,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 #0b2a5c) drop-shadow(0 0 20px #3b82f6aa)}
#title .sub{font-size:20px;color:#cfe6ff;text-shadow:0 2px 4px #000;text-align:center;line-height:1.5}
.big{font-size:26px;padding:14px 46px;border-radius:16px;background:linear-gradient(#ffd54a,#ff9f1a);color:#3a1d00;box-shadow:0 5px 0 #a35a00;transition:transform .1s}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 #a35a00}
.small{font-size:16px;padding:8px 18px;border-radius:12px;background:#ffffff22;color:#fff;border:2px solid #ffffff44}
#title .keys{font-size:14px;color:#9fb6d0;text-align:center;line-height:1.7;margin-top:6px}

/* 기체 선택 */
#sel{background:#0b1426;align-items:stretch}
.selTop{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#13213d;height:46px}
.selTop b{font-size:20px;flex:1}
.selTop span{font-size:14px;color:#ffd54a}
.tabs{display:flex;gap:6px;padding:6px 8px;background:#0f1a31}
.tabs button{flex:1;font-size:15px;padding:7px 0;border-radius:10px;background:#1c2b4b;color:#9fb6d0}
.tabs button.on{background:#3b82f6;color:#fff}
#grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px 8px;align-content:start;touch-action:pan-y}
.card{position:relative;background:#16233f;border-radius:10px;padding:4px 2px 5px;text-align:center;cursor:pointer;border:2px solid transparent}
.card.on{border-color:#ffd54a;background:#22355c}
.card canvas{width:46px;height:46px;display:block;margin:0 auto}
.card .nat{font-size:10px;color:#9fb6d0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .nm{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .flag{height:4px;border-radius:2px;margin:2px 8px 0}
.tier{position:absolute;top:3px;left:4px;font-size:11px;width:17px;height:17px;line-height:17px;border-radius:5px;color:#000}
.tS{background:#c084fc}.tA{background:#60a5fa}.tB{background:#4ade80}.tC{background:#fb923c}
.medal{position:absolute;top:1px;right:3px;font-size:13px}
#detail{height:300px;background:#13213d;border-top:2px solid #2a3d66;padding:8px 10px;display:flex;flex-direction:column;gap:5px}
#dHead{display:flex;align-items:center;gap:8px}
#dHead .nm{font-size:21px}
#dHead .nat{font-size:14px;color:#9fb6d0}
#dHead .tier{position:static;display:inline-block;font-size:14px;width:auto;padding:0 7px;height:22px;line-height:22px}
#dHead .mul{font-size:14px;color:#ffd54a;margin-left:auto}
#dBody{display:flex;gap:6px;align-items:center}
#dPlane{width:108px;height:108px;background:radial-gradient(#2a4372,#13213d 70%);border-radius:14px}
#dRadar{width:140px;height:130px}
#dStats{flex:1;font-size:13px;display:flex;flex-direction:column;gap:3px}
#dStats .row{display:flex;align-items:center;gap:4px}
#dStats .row i{font-style:normal;width:28px;color:#9fb6d0}
#dStats .bar{flex:1;height:8px;background:#0b1426;border-radius:4px;overflow:hidden}
#dStats .bar div{height:100%;background:linear-gradient(90deg,#3b82f6,#60e0ff)}
#dText{font-size:13.5px;color:#cfe0f5;line-height:1.5}
#dText b{color:#ffd54a;font-weight:normal}
#dFoot{display:flex;align-items:center;gap:8px;margin-top:auto}
#dFoot .best{flex:1;font-size:14px;color:#9fb6d0}
#goBtn{font-size:21px;padding:8px 28px}

/* 게임 중 */
#hudBtns{position:absolute;inset:0;pointer-events:none;display:none}
#hudBtns.on{display:block}
#hudBtns button{pointer-events:auto;position:absolute;border-radius:50%;color:#fff;font-size:15px;background:#0006;border:2px solid #fff6}
#btnPause{top:58px;right:8px;width:40px;height:40px;font-size:16px}
#btnMute{top:58px;right:54px;width:40px;height:40px;font-size:16px}
#titleMute{position:absolute;top:12px;right:12px;width:46px;height:46px;border-radius:50%;font-size:20px;background:#0006;border:2px solid #fff6;color:#fff}
#btnBomb{bottom:70px;right:10px;width:66px;height:66px}
#btnSpec{bottom:146px;right:10px;width:66px;height:66px}
#btnSpec.ready{background:#ffb30099;border-color:#ffd54a;animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.ov{background:#000a;justify-content:center;gap:14px;text-align:center}
.ov h2{font-family:'Black Han Sans',sans-serif;font-size:52px;text-shadow:0 4px 0 #0008}
.ov p{font-size:19px;line-height:1.6;color:#dbe8ff}
.ov .row{display:flex;gap:10px}

/* 계정 · 코인 · 튜닝 */
#acct{display:flex;align-items:center;gap:8px;font-size:16px;background:#0008;padding:6px 8px 6px 14px;border-radius:14px;text-shadow:0 1px 2px #000}
#acct .coin,.coin{color:#ffd54a}
#login{background:#000c;justify-content:center}
.box{width:340px;background:#13213d;border:2px solid #2a3d66;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px}
.box h3{font-size:24px;text-align:center}
.box input{font-family:inherit;font-size:18px;padding:10px 12px;border-radius:10px;border:2px solid #2a3d66;background:#0b1426;color:#fff;outline:none}
.box input:focus{border-color:#3b82f6}
.box .msg{min-height:20px;font-size:14px;color:#ff8a8a;text-align:center}
.box .hint{font-size:13px;color:#9fb6d0;text-align:center;line-height:1.5}
.box .big{font-size:20px;padding:10px}
.link{background:none;color:#9fd3ff;font-size:15px;text-decoration:underline}
#dStats .row .tv{width:34px;text-align:right}
#dStats .row .tv b{color:#ffd54a;font-weight:normal}
#dStats .bar{display:flex}
#dStats .bar .tb{background:linear-gradient(90deg,#ffb300,#ffd54a)}
.tune{font-size:11px;padding:2px 0;width:52px;border-radius:7px;background:#ffb300;color:#3a1d00}
.tune:disabled{background:#2a3d66;color:#6f86a8;cursor:default}
.card .wrench{position:absolute;bottom:3px;right:4px;font-size:11px}
#overCoin{font-size:22px;color:#ffd54a;min-height:30px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="480" height="720"></canvas>

  <div id="title" class="screen on">
    <button id="titleMute" class="muteBtn" title="배경음악 켜기/끄기 (M)">🎵</button>
    <h1>2026</h1>
    <div class="sub">세계 50개 나라 · 68대의 비행기<br>정체불명 <b style="color:#ff8080">무인기 군단</b>을 막아라!</div>
    <div id="acct"></div>
    <button class="big" id="startBtn">✈️ 출격 준비</button>
    <div class="sub" id="titleDex" style="font-size:16px;color:#ffd54a"></div>
    <div class="keys">방향키/WASD 이동 · 자동 사격<br>Z 특수기 · X/스페이스 폭탄 · P 일시정지 · M 음악<br>📱 휴대폰: 화면을 끌어서 이동</div>
  </div>

  <div id="sel" class="screen">
    <div class="selTop"><button class="small" id="selBack">← 처음</button><b>기체 선택 · 도감</b><span id="dexCount"></span></div>
    <div class="tabs">
      <button data-s="F" class="on">⚔️ 전투기 50</button>
      <button data-s="A">💥 공격기 10</button>
      <button data-s="B">💣 폭격기 8</button>
    </div>
    <div id="grid"></div>
    <div id="detail">
      <div id="dHead"></div>
      <div id="dBody">
        <canvas id="dPlane" width="240" height="240"></canvas>
        <canvas id="dRadar" width="300" height="280"></canvas>
        <div id="dStats"></div>
      </div>
      <div id="dText"></div>
      <div id="dFoot"><div class="best" id="dBest"></div><button class="big" id="goBtn">🚀 출격!</button></div>
    </div>
  </div>

  <div id="hudBtns">
    <button id="btnPause">⏸</button>
    <button id="btnMute" class="muteBtn">🎵</button>
    <button id="btnSpec">⚡<br>특수</button>
    <button id="btnBomb">💣<br>폭탄</button>
  </div>

  <div id="pause" class="screen ov">
    <h2>⏸ 일시정지</h2>
    <div class="row"><button class="big" id="resumeBtn">계속하기</button></div>
    <button class="small" id="quitBtn">기체 선택으로</button>
  </div>

  <div id="login" class="screen">
    <div class="box">
      <h3 id="lgTitle">🔑 로그인</h3>
      <input id="lgName" maxlength="12" placeholder="아이디 (2~12글자)" autocomplete="username">
      <input id="lgPw" type="password" maxlength="40" placeholder="비밀번호 (4글자 이상)" autocomplete="current-password">
      <div class="msg" id="lgMsg"></div>
      <button class="big" id="lgGo">로그인</button>
      <button class="link" id="lgSwap">처음이에요 → 회원가입</button>
      <div class="hint">로그인하면 게임할 때마다 🪙 코인이 쌓이고,<br>코인으로 기체 능력치를 튜닝할 수 있어요!</div>
      <button class="small" id="lgClose">닫기</button>
    </div>
  </div>

  <div id="over" class="screen ov">
    <h2 id="overT">게임 오버</h2>
    <p id="overP"></p>
    <div id="overCoin"></div>
    <div class="row"><button class="big" id="retryBtn">🔁 다시</button></div>
    <button class="small" id="toSelBtn">기체 선택으로</button>
  </div>
</div>

function fit() {
  SCALE = Math.min(innerWidth / W, innerHeight / H);

  w.style.transform = `scale(${SCALE})`;

}
addEventListener('resize', fit); fit();

let AC = null, NOISE = null, lastShotSnd = 0;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    NOISE = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = NOISE.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(f1, f2, dur, type, vol) {
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol, freq) {
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NOISE; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + dur);
}
function snd(k) {
  if (!AC) return;
  try {
    if (k === 'shot') { const n = performance.now(); if (n - lastShotSnd < 90) return; lastShotSnd = n; tone(900, 500, .05, 'square', .025); }
    else if (k === 'boom') noise(.25, .25, 900);
    else if (k === 'big') { noise(.9, .5, 500); tone(120, 40, .8, 'sawtooth', .15); }
    else if (k === 'item') { tone(600, 1200, .12, 'square', .08); }
    else if (k === 'bomb') { noise(1.2, .5, 300); tone(200, 30, 1, 'sawtooth', .2); }
    else if (k === 'hurt') { tone(300, 80, .3, 'square', .15); noise(.3, .3, 1500); }
    else if (k === 'spec') { tone(300, 1500, .35, 'sawtooth', .1); }
  } catch (e) {}
}

const NOTE_N = {C:0, D:2, E:4, F:5, G:7, A:9, B:11};
const midiOf = s => 12 * (+s.slice(-1) + 1) + NOTE_N[s[0]] + (s[1] === '#' ? 1 : 0);
const freqOf = m => 440 * Math.pow(2, (m - 69) / 12);
function expandLead(str) {
  const out = [];
  str.trim().split(/\s+/).forEach(t => {
    if (t === '.') out.push(null, null);
    else if (t === '-') out.push('-', '-');
    else out.push(midiOf(t), '-');
  });
  return out;
}
// [근음, 'M'=장조 / 'm'=단조]
const CH = {C:[48,'M'], G:[43,'M'], Am:[45,'m'], F:[41,'M'], E:[40,'M'], Dm:[38,'m'], Em:[40,'m']};
const STAGE_LEAD =
  'E5 G5 C6 G5 E5 G5 A5 G5  D5 G5 B5 G5 D5 G5 B5 D6  C6 B5 A5 E5 C5 E5 A5 B5  C6 - A5 - F5 A5 C6 D6 ' +
  'E6 - D6 C6 - G5 E5 G5  D6 - C6 B5 - G5 D5 G5  C6 - B5 A5 - E5 A5 B5  C6 D6 E6 - D6 C6 A5 G5';
const BOSS_LEAD =
  'A5 . A5 C6 . A5 E6 D6  C6 . A5 . F5 A5 C6 .  B5 . G5 D6 . B5 G5 B5  G#5 . B5 E6 . D6 B5 G#5 ' +

const SONGS = {

  // 스테이지가 올라갈수록 키가 높아지고 빨라져요
  stage:st => ({bpm:140 + st * 15, tr:st * 2, chords:['C','G','Am','F'], lead:expandLead(STAGE_LEAD), arp:'on', bass:'eighth',
    kick:st < 2 ? 'x...x...x...x...' : 'x...x...x...x.x.', snare:'....x.......x...', hat:st ? 'x.xxx.xxx.xxx.xx' : 'x.x.x.x.x.x.x.x.'}),
  boss:st => ({bpm:168 + st * 8, tr:st, chords:['Am','F','G','E'], lead:expandLead(BOSS_LEAD), arp:'on', bass:'drive', leadType:'sawtooth',
    kick:'x..xx..xx..xx..x', snare:'....x.......x..x', hat:'xxxxxxxxxxxxxxxx'}),
  clear:() => ({bpm:150, once:true, chords:['C'], lead:expandLead('C5 E5 G5 C6 - - G5 C6 - - - - . . . .'), bass:'none', kick:'x...............', snare:'', hat:''}),
  win:() => ({bpm:132, once:true, chords:['C','F','G','C'], lead:expandLead('C5 E5 G5 C6 - G5 C6 E6  F5 A5 C6 F6 - C6 F6 A6  G5 B5 D6 G6 - F6 E6 D6  C6 - E6 - G6 - - -'), arp:'on', bass:'eighth', kick:'x...x...x...x...', snare:'....x.......x...', hat:'x.x.x.x.x.x.x.x.'}),
  over:() => ({bpm:96, once:true, chords:['Am'], lead:expandLead('E5 - C5 - A4 - G#4 - A4 - - - . . . .'), bass:'none', kick:'', snare:'', hat:''}),
};
let MUTED = false;
try { MUTED = localStorage.getItem('sky2026-mute') === '1'; } catch (e) {}
const MUS = {cur:null, song:null, step:0, next:0, timer:null, gain:null, paused:false};
function playSong(name, arg) {
  const key = name + (arg != null ? arg : '');
  if (!AC || MUS.cur === key) return;
  MUS.cur = key;
  if (name === 'none') { MUS.song = null; return; }
  if (!MUS.gain) { MUS.gain = AC.createGain(); MUS.gain.gain.value = .5; MUS.gain.connect(AC.destination); }
  MUS.song = SONGS[name](arg || 0);
  MUS.song.len = MUS.song.lead ? MUS.song.lead.length : MUS.song.chords.length * 16;
  MUS.step = 0; MUS.next = AC.currentTime + .08;
  if (!MUS.timer) MUS.timer = setInterval(schedMusic, 25);
}
function schedMusic() {
  const S = MUS.song;
  if (!S || !AC) return;
  if (MUTED || MUS.paused) { MUS.next = AC.currentTime + .05; return; }
  const spb = 60 / S.bpm / 4;  // 16분음표 길이
  if (MUS.next < AC.currentTime - .2) MUS.next = AC.currentTime + .02;
  while (MUS.next < AC.currentTime + .12) {
    if (S.once && MUS.step >= S.len) { MUS.song = null; return; }
    try { playStep(S, MUS.step % S.len, MUS.next, spb); } catch (e) {}
    MUS.next += spb; MUS.step++;
  }
}
function voice(type, m, t, dur, vol, cut) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freqOf(m), t);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .006);
  g.gain.setValueAtTime(vol * .7, t + Math.min(dur * .5, .08));
  g.gain.exponentialRampToValueAtTime(.0005, t + dur);
  let node = o;
  if (cut) { const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut; node = o.connect(f); }
  node.connect(g).connect(MUS.gain); o.start(t); o.stop(t + dur + .02);
}
function drum(kind, t) {
  if (kind === 'k') {
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + .12);
    g.gain.setValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.001, t + .14);
    o.connect(g).connect(MUS.gain); o.start(t); o.stop(t + .15);
  } else {
    const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), dur = kind === 's' ? .14 : .035;
    s.buffer = NOISE; f.type = 'highpass'; f.frequency.value = kind === 's' ? 1500 : 7000;
    g.gain.setValueAtTime(kind === 's' ? .22 : .06, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f).connect(g).connect(MUS.gain); s.start(t, Math.random() * .5); s.stop(t + dur);
  }
}
function playStep(S, step, t, spb) {
  const s = step % 16, tr = S.tr || 0;
  const [root, type] = CH[S.chords[Math.floor(step / 16) % S.chords.length]];
  const tones = type === 'M' ? [0, 4, 7, 12] : [0, 3, 7, 12];
  // 드럼
  if (S.kick && S.kick[s] === 'x') drum('k', t);
  if (S.snare && S.snare[s] === 'x') drum('s', t);
  if (S.hat && S.hat[s] === 'x') drum('h', t);
  // 베이스
  const b = root + tr - 12;
  if (S.bass === 'eighth' && s % 2 === 0) voice('square', b + (s % 4 === 2 ? 12 : 0), t, spb * 1.8, .09, 900);
  if (S.bass === 'drive') voice('sawtooth', b + (s % 8 === 6 ? 12 : 0), t, spb * .9, .08, 700);
  if (S.bass === 'half' && s % 8 === 0) voice('triangle', b + 12, t, spb * 7.5, .2);
  // 아르페지오 (화음을 빠르게 쪼개 연주)
  if (S.arp === 'on') voice('square', root + tr + 12 + tones[s % 4], t, spb * .9, .025, 3000);
  if (S.arp === 'soft' && s % 2 === 0) voice('triangle', root + tr + 24 + tones[(s / 2) % 4], t, spb * 3, .07);
  // 멜로디
  if (S.lead) {
    const n = S.lead[step];
    if (typeof n === 'number') {
      let len = 1; while (S.lead[(step + len) % S.len] === '-' && len < 16) len++;
      voice(S.leadType || 'square', n + tr, t, spb * len * .95, .055, 4500);
      voice('triangle', n + tr - 12, t, spb * len * .95, .05);
    }
  }
}
function setMute(m) {
  MUTED = m;

function updateMusic() {
  if (!AC) return;
  MUS.paused = !!(G && G.state === 'pause');
  if (!G) return playSong('title');
  if (G.state !== 'play') return;
  if (G.clearT) return playSong('clear', G.stage);
  if (G.boss && !G.bossDying) return playSong('boss', G.stage);
  if (G.boss && !G.boss.mid) return playSong('none');   // 보스 폭발 중엔 조용히
  playSong('stage', G.stage);
}

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hash = k => { const s = Math.sin(k * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = c => clamp(Math.round(c + amt * 255), 0, 255);
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;

/* ───────────── 업데이트 ───────────── */
function update() {
  if (!G || G.state !== 'play') return;
  G.t++;
  const p = G.p, B = G.buffs;
  for (const k in B) if (B[k] > 0) B[k]--;
  if (G.flash) G.flash--;
  if (G.shake) G.shake--;
  if (G.banner) G.banner--;
  G.bgY += SCROLL;

  // 시간표 진행 (보스가 있을 땐 멈춤)
  if (!G.boss && !G.clearT) {
    G.clock++;
    while (G.si < G.script.length && G.script[G.si][0] * 60 <= G.clock) { const [, n, r] = G.script[G.si++]; spawnWave(n, r); }
  }
  // 스테이지 클리어
  if (G.clearT) {
    G.clearT--;
    if (G.clearT === 120) {
      const bonus = p.bombs * 2000 + (G.plane.series === 'B' ? Math.round(p.hp / p.maxHp * 20000) : p.lives * 5000);
      G.clearBonus = bonus; G.score += bonus;
    }
    if (G.clearT === 0) {
      if (G.stage >= STAGES.length - 1) return endGame(true);
      loadStage(G.stage + 1);
      p.hp = G.plane.series === 'B' ? Math.min(p.maxHp, p.hp + p.maxHp * .5) : p.maxHp;
    }
  }

    }
  } else {
    let dx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    let dy = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    if (dx && dy) { dx *= .7071; dy *= .7071; }
    const sp = p.speed * (B.burner ? 1.35 : 1) * (B.evade ? 1.4 : 1) * (B.dash ? 1.5 : 1);
    p.vx += (dx * sp - p.vx) * p.acc; p.vy += (dy * sp - p.vy) * p.acc;
    p.x += p.vx; p.y += p.vy;
    // 터치/마우스: 속도 제한 안에서 따라가기
    if (tdx || tdy) {

    }

    if (p.inv) p.inv--;

    // 사격
    if (--p.fireCd <= 0) { firePlayer(); p.fireCd = p.interval * (B.burner ? .5 : 1); }
    if (B.gun) for (let i = 0; i < 2; i++) pbullet(p.x + rand(-6, 6), p.y - 20 * p.size, rand(-.03, .03), 16, p.dmg * .7, {col:'#fff3a0', r:3});
    if (G.plane.series === 'A' && --p.gcd <= 0) {
      const t = nearestEnemy(p.x, p.y, true);
      if (t) { for (let k = 0; k < 1 + (p.power >> 1); k++) homing(p.x + (k % 2 ? 10 : -10), p.y, (k % 2 ? .3 : -.3), p.dmg * 1.6, {gOnly:true, col:'#ff8c42', tg:t}); p.gcd = 34; }
      else p.gcd = 8;
    }
    if (G.plane.series === 'B' && --p.tcd <= 0) {
      const t = nearestEnemy(p.x, p.y, false, true) || nearestEnemy(p.x, p.y);
      if (t) {
        const pos = targetPos(t), n = 1 + (p.power >> 1);
        for (let k = 0; k < n; k++) {
          const ox = (k - (n - 1) / 2) * 22, a = Math.atan2(pos[0] - (p.x + ox), -(pos[1] - p.y));
          pbullet(p.x + ox, p.y, a, 9, p.dmg * .55, {col:'#fff', r:3});
        }
      }

    }
    if (B.escort && --p.ecd <= 0) {
      p.ecd = 8;

      const pos = b.tg && targetPos(b.tg);

      let na = cur;
      if (pos) { let df = Math.atan2(pos[1] - b.y, pos[0] - b.x) - cur; while (df > Math.PI) df -= Math.PI * 2; while (df < -Math.PI) df += Math.PI * 2; na = cur + clamp(df, -b.turn, b.turn); }
      b.vx = Math.cos(na) * spd; b.vy = Math.sin(na) * spd;
      if (G.t % 2 === 0) G.parts.push({x:b.x, y:b.y, vx:0, vy:0, life:12, max:12, r:2.5, col:'#ffffff88'});
    }
    b.x += b.vx; b.y += b.vy;
    if (b.y < -30 || b.y > H + 30 || b.x < -30 || b.x > W + 30) { b.gone = true; continue; }
    // 충돌
    for (const e of G.en) {
      if (e.dead || e.t < 0) continue;
      if (b.gOnly && !e.ground) continue;
      if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 < (e.r + b.r) ** 2) {
        damageEnemy(e, b.dmg * (b.antiship && e.ground ? 2 : 1));
        b.gone = true; if (b.kind === 'm') explode(b.x, b.y, 10, true);
        break;
      }
    }
    if (!b.gone && bossHitTest(b)) { b.gone = true; if (b.kind === 'm') explode(b.x, b.y, 12, true); }
  }
  G.pb = G.pb.filter(b => !b.gone);

  updateCarpet();

  // 적 (정찰 특수기 중엔 절반 속도)
  const slowSkip = B.slow && G.t % 2;
  if (!slowSkip) {
    for (const e of G.en) { if (!e.dead) updateEnemy(e); }
    updateBoss();
    for (const b of G.eb) { b.x += b.vx; b.y += b.vy; }
  }
  G.eb = G.eb.filter(b => b.y > -20 && b.y < H + 20 && b.x > -20 && b.x < W + 20 && !b.gone);
  G.en = G.en.filter(e => {
    if (e.dead) return false;
    if (e.y > H + 70 || (e.t > 30 && (e.x < -90 || e.x > W + 90)) || e.y < -400) {
      if (e.group != null) { G.groups[e.group].fail = true; G.groups[e.group].n--; }
      return false;
    }
    return true;
  });

  // 피격
  if (!p.dead) {
    const hr = p.hitR * (B.evade ? .35 : 1);
    const safe = p.inv > 0 || B.stealth || B.dash;
    for (const b of G.eb) {
      if ((b.x - p.x) ** 2 + (b.y - p.y) ** 2 < (hr + b.r * .8) ** 2) {
        if (B.stealth) continue;
        b.gone = true;
        if (!safe) { hurt(20); break; }
      }
    }
    for (const e of G.en) {
      if (e.dead || e.ground || e.t < 0) continue;
      if ((e.x - p.x) ** 2 + (e.y - p.y) ** 2 < (e.r * .8 + hr + 4 * p.size) ** 2) {
        if (B.dash) { damageEnemy(e, 300); continue; }
        if (!safe) { damageEnemy(e, 20); hurt(30); break; }
      }
    }
  }

  // 아이템
  for (const it of G.items) {
    it.t++;
    const dx = p.x - it.x, dy = p.y - it.y, dd = Math.hypot(dx, dy);
    if (!p.dead && dd < 90) { it.x += dx / dd * 4; it.y += dy / dd * 4; }
    else { it.y += 1.1; it.x += Math.sin(it.t * .05) * .8; }
    if (!p.dead && dd < 24 + 6 * p.size) { it.gone = true; pickup(it.k); }
    if (it.y > H + 20) it.gone = true;
  }
  G.items = G.items.filter(i => !i.gone);

  // 파티클
  for (const q of G.parts) { q.x += q.vx; q.y += q.vy + (q.ring ? 0 : SCROLL * .3); q.vx *= .94; q.vy *= .94; q.life--; }
  G.parts = G.parts.filter(q => q.life > 0);

  updateButtons();
}
function updateEnemy(e) {
  e.t++;
  if (e.hit) e.hit--;
  if (e.t < 0) return;
  const st = G.stage, bsp = 2.6 + st * .35;
  switch (e.type) {
    case 'drone':
      e.x += e.vx; e.y += e.vy;
      if (e.shoots && e.y > 40 && e.y < H * .55 && --e.fireCd <= 0) { e.fireCd = 9999; ebullet(e.x, e.y, aim(e.x, e.y), bsp); }
      break;
    case 'swoop':
      e.x += e.dir * 3;
      e.y = e.base + Math.sin(e.t * .045) * 60 + e.t * .7;
      if (Math.abs(e.x - W / 2) < 3 && Math.random() < .45 + st * .2) ebullet(e.x, e.y, aim(e.x, e.y), bsp);
      break;
    case 'heavy':
      if (e.t < 70) e.y += e.vy;
      else if (e.t > 380) e.y -= 1.5;
      if (e.t > 60 && e.t < 380 && --e.fireCd <= 0) { e.fireCd = 70 - st * 12; fan(e.x, e.y + 10, aim(e.x, e.y), 3 + st, .2, bsp - .2, '#ff9f43'); }
      e.x += Math.sin(e.t * .02) * .8;
      break;
    case 'tank': case 'turret': case 'ship': case 'base':
      e.x += e.vx; e.y += e.vy;
      if (e.type !== 'base') {
        e.ang = aim(e.x, e.y);
        if (e.y > 20 && e.y < H * .62 && --e.fireCd <= 0) {
          if (e.type === 'tank') { e.fireCd = 110 - st * 15; ebullet(e.x, e.y, e.ang, bsp - .4, '#ffe14d'); }
          if (e.type === 'turret') { e.fireCd = 95 - st * 15; ebullet(e.x, e.y, e.ang, bsp, '#ff5050'); later(8, () => !e.dead && ebullet(e.x, e.y, aim(e.x, e.y), bsp, '#ff5050')); }
          if (e.type === 'ship') { e.fireCd = 80 - st * 10; [-14, 14].forEach(oy => fan(e.x, e.y + oy, aim(e.x, e.y + oy), 3, .18, bsp - .3, '#ff9f43')); }
        }
      }
      break;
  }
}
function hurt(d) {
  const p = G.p;
  p.hp -= d; p.inv = G.plane.series === 'B' ? 35 : 70; G.shake = 12; snd('hurt');
  if (p.hp <= 0) {
    p.hp = 0; p.lives--; p.dead = 110;
    explode(p.x, p.y, 60); snd('big');
    p.power = Math.max(1, p.power - 1);
    G.eb = [];
    G.buffs = {};
  }
}
function pickup(k) {
  const p = G.p; snd('item');
  if (k === 'P') {
    if (p.power < 4) p.power++;
    else if (G.plane.series === 'B') p.hp = Math.min(p.maxHp, p.hp + p.maxHp * .15);
    else addScore(1000);
  } else if (k === 'B') { if (p.bombs < 6) p.bombs++; else addScore(1000); }
  else addScore(500);
}

/* ───────────── 그리기 ───────────── */
function drawEnemy(e) {
  if (e.t < 0) return;
  ctx.save(); ctx.translate(e.x, e.y);
  const fl = e.hit ? '#fff' : null;
  switch (e.type) {
    case 'drone': {
      ctx.strokeStyle = fl || '#3a3f47'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-10, -10); ctx.lineTo(10, 10); ctx.moveTo(10, -10); ctx.lineTo(-10, 10); ctx.stroke();
      ctx.fillStyle = fl || '#5a616b'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.fill();
      ctx.fillStyle = '#ff3b3b'; ctx.beginPath(); ctx.arc(0, 1, 2.4, 0, 7); ctx.fill();
      ctx.strokeStyle = '#ffffff88'; ctx.lineWidth = 1.2;
      const a = G.t * .6;
      [[-10,-10],[10,-10],[-10,10],[10,10]].forEach(([x, y]) => { ctx.beginPath(); ctx.moveTo(x - 5 * Math.cos(a), y - 5 * Math.sin(a)); ctx.lineTo(x + 5 * Math.cos(a), y + 5 * Math.sin(a)); ctx.stroke(); });
      break;
    }
    case 'swoop':
      ctx.rotate(Math.PI);
      ctx.fillStyle = fl || '#4a3a4f';
      shapePath(ctx, [[0,-14],[12,10],[4,7],[0,12]]); ctx.fill();
      ctx.fillStyle = '#ff3b3b'; ctx.fillRect(-1.5, 0, 3, 6);
      break;
    case 'heavy':
      ctx.rotate(Math.PI);
      ctx.fillStyle = '#0003'; ctx.beginPath(); ctx.ellipse(4, -6, 30, 14, 0, 0, 7); ctx.fill();
      drawPlane(ctx, 'wing', 0, 0, 1.6, fl || '#3d434c', '#ff3b3b');
      break;
    case 'tank':
      ctx.fillStyle = fl || '#6d6a45'; ctx.fillRect(-11, -14, 22, 28);
      ctx.fillStyle = '#3a3828'; ctx.fillRect(-14, -14, 5, 28); ctx.fillRect(9, -14, 5, 28);
      ctx.rotate(e.ang); ctx.fillStyle = '#4c4a30'; ctx.beginPath(); ctx.arc(0, 0, 7, 0, 7); ctx.fill(); ctx.fillRect(0, -2.5, 17, 5);
      break;
    case 'turret':
      ctx.fillStyle = G.stage === 2 ? '#8b95a3' : '#7d7466'; ctx.fillRect(-16, -16, 32, 32);
      ctx.strokeStyle = '#0005'; ctx.strokeRect(-16, -16, 32, 32);
      ctx.rotate(e.ang); ctx.fillStyle = fl || '#4b525c'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, 7); ctx.fill(); ctx.fillRect(0, -3, 19, 6);
      break;
    case 'ship':
      ctx.fillStyle = '#ffffff40'; ctx.beginPath(); ctx.ellipse(0, -30, 22, 40, 0, 0, 7); ctx.fill();
      ctx.fillStyle = fl || '#646d77';
      ctx.beginPath(); ctx.moveTo(0, 46); ctx.quadraticCurveTo(20, 10, 16, -40); ctx.lineTo(-16, -40); ctx.quadraticCurveTo(-20, 10, 0, 46); ctx.fill();
      ctx.fillStyle = '#4b535c'; ctx.fillRect(-8, -20, 16, 24);
      [-14, 14].forEach(oy => { ctx.save(); ctx.translate(0, oy); ctx.rotate(aim(e.x, e.y + oy)); ctx.fillStyle = '#383f47'; ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, 7); ctx.fill(); ctx.fillRect(0, -2, 12, 4); ctx.restore(); });
      break;
    case 'base':
      ctx.fillStyle = '#0003'; ctx.fillRect(-24, -20, 54, 50);
      ctx.fillStyle = fl || (G.stage === 2 ? '#7c8796' : '#8b7b5c'); ctx.fillRect(-28, -26, 56, 52);
      ctx.fillStyle = '#5a5245'; ctx.fillRect(-20, -18, 40, 36);
      ctx.fillStyle = '#ff3b3b'; ctx.beginPath(); ctx.arc(0, 0, 7, 0, 7); ctx.fill();
      ctx.strokeStyle = '#fff8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 11, 0, 7); ctx.stroke();
      break;
  }
  ctx.restore();
}
function drawItem(it) {
  const col = it.k === 'P' ? '#3b82f6' : it.k === 'B' ? '#ef4444' : '#f5b301';
  ctx.save(); ctx.translate(it.x, it.y);
  ctx.fillStyle = col; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  if (it.k === 'M') {
    ctx.rotate(it.t * .05); ctx.beginPath();
    for (let i = 0; i < 10; i++) { const r = i % 2 ? 5 : 12, a = i * Math.PI / 5; ctx.lineTo(Math.sin(a) * r, -Math.cos(a) * r); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.roundRect(-12, -10, 24, 20, 5); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = '16px Jua'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(it.k, 0, 1);
  }
  ctx.restore();
}
function drawPlayer() {
  const p = G.p, P = G.plane, B = G.buffs;
  if (p.dead) return;
  if (p.inv && !B.dash && Math.floor(p.inv / 4) % 2) return;
  const alpha = B.stealth ? .35 : 1;
  ctx.fillStyle = '#0003';
  ctx.save(); ctx.translate(14, 20); drawPlane(ctx, P.shape, p.x, p.y, p.size * 1.05, '#000000', '#000000', {alpha:.22}); ctx.restore();
  if (B.dash) { ctx.fillStyle = '#7dd3fc55'; ctx.beginPath(); ctx.arc(p.x, p.y, 30 * p.size, 0, 7); ctx.fill(); }
  drawPlane(ctx, P.shape, p.x, p.y, p.size, P.col[0], P.col[1], {flame:true, alpha, rot:clamp(p.vx * .02, -.15, .15) * 0});
  if (B.escort) [-44, 44].forEach(ox => drawPlane(ctx, 'stealth', p.x + ox, p.y + 6, .55, '#6b7280', P.col[1], {flame:true}));
  if (B.evade || keys.ShiftLeft) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(2, p.hitR * (B.evade ? .35 : 1)), 0, 7); ctx.fill(); }
}
function draw() {
  ctx.save();
  if (G && G.shake) ctx.translate(rand(-4, 4), rand(-4, 4));
  if (!G) { drawBg('sky', performance.now() * .05); drawTitleDemo(); ctx.restore(); return; }
  drawBg(STAGES[G.stage].bg, G.bgY);
  G.en.forEach(e => e.ground && drawEnemy(e));
  if (G.boss && G.boss.ground) drawBoss();
  G.items.forEach(drawItem);
  G.en.forEach(e => !e.ground && drawEnemy(e));
  if (G.boss && !G.boss.ground) drawBoss();
  // 내 탄
  for (const b of G.pb) {
    ctx.fillStyle = b.col;
    if (b.kind === 'm') { ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx)); ctx.fillRect(-b.r * 1.4, -b.r * .4, b.r * 2.8, b.r * .8); ctx.restore(); }
    else { ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r * .7, b.r * 1.8, Math.atan2(b.vx, -b.vy), 0, 7); ctx.fill(); }
  }
  drawPlayer();
  // 적 탄
  for (const b of G.eb) {
    ctx.fillStyle = b.col; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * .45, 0, 7); ctx.fill();
  }
  // 파티클
  for (const q of G.parts) {
    const a = q.life / q.max;
    if (q.ring) { ctx.strokeStyle = `rgba(255,240,200,${a})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (1.3 - a), 0, 7); ctx.stroke(); }
    else { ctx.globalAlpha = a; ctx.fillStyle = q.col; ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (.5 + a * .5), 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
  }
  if (G.flash) { ctx.fillStyle = `rgba(255,255,255,${G.flash / 30})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
  drawHud();
}

      `<canvas width="92" height="92"></canvas><div class="flag" style="background:linear-gradient(90deg,${p.col[1]},${p.col[1]} 50%,${p.col[0]} 50%)"></div>` +
      `<div class="nat">${p.nat}</div><div class="nm">${p.name}</div>`;
    drawPlaneIcon(d.querySelector('canvas'), p);
    d.onclick = () => selectPlane(p.id);
    g.appendChild(d);
  });
}
const STAT_NAMES = ['공격','속도','체력','연사','기동'];
function selectPlane(id) {
  selPlane = id;
  const P = PLANES[id];
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('on', +c.dataset.id === id));
  $('dHead').innerHTML = `<span class="tier t${P.tier}">${P.tier}등급</span><span class="nm">${P.name}</span><span class="nat">${P.nat}</span><span class="mul">점수 ×${TIER_MUL[P.tier]}</span>`;
  const pc = $('dPlane'), c = pc.getContext('2d');
  c.clearRect(0, 0, 240, 240);
  drawPlane(c, P.shape, 120, 124, 4.6 * (P.series === 'B' ? .95 : P.shape === 'transport' ? .9 : 1.05), P.col[0], P.col[1], {flame:true});
  const tn = tuneOf(id), eff = effStats(id);
  drawRadar(P.st, eff);
  $('dStats').innerHTML = P.st.map((v, i) => {
    const lv = tn[i], cost = TUNE_COST[lv];
    const btn = !SESSION ? `<button class="tune" disabled title="로그인 필요">🔒</button>`
      : lv >= MAX_TUNE ? `<button class="tune" disabled>MAX</button>`
      : `<button class="tune" data-st="${i}" ${WALLET && WALLET.coins >= cost ? '' : 'disabled'}>+1 🪙${cost}</button>`;
    return `<div class="row"><i>${STAT_NAMES[i]}</i><div class="bar"><div style="width:${v * 100 / 13}%"></div><div class="tb" style="width:${lv * 100 / 13}%"></div></div>` +
      `<span class="tv">${v}${lv ? `<b>+${lv}</b>` : ''}</span>${btn}</div>`;
  }).join('') +
    `<div class="row" style="color:#ffd54a"><i>합계</i>${P.sum}${eff.reduce((a, b) => a + b) - P.sum ? ` → ${eff.reduce((a, b) => a + b)}` : ''}점</div>`;
  document.querySelectorAll('.tune[data-st]').forEach(b => b.onclick = () => tune(+b.dataset.st));
  const F = FAMILY[P.fam], S = SPECIALS[P.spec];
  const extra = (P.series === 'B' ? `체력 게이지 ${eff[2] * 30}` : `목숨 3 · 체력 ${eff[2] * 10}`) + (SESSION ? '' : ' · 🔒 튜닝은 로그인 필요');
  $('dText').innerHTML = `<b>${F[0]}</b> — ${F[1]}<br><b>⚡ ${S[0]}</b> — ${S[1]}<br><span style="color:#9fb6d0">${extra} · 폭탄 ${P.fam === 'hornet' || P.series === 'B' ? 3 : 2}개</span>`;
  const d = dexInfo(id);
  $('dBest').innerHTML = d.best ? `최고 점수 ${d.best.toLocaleString()}${d.clear ? ' · 🏅 클리어' : ''}` : '아직 기록 없음';
}
function drawRadar(st, eff) {
  const c = $('dRadar').getContext('2d'), cx = 150, cy = 146, R = 92;
  c.clearRect(0, 0, 300, 280);
  const pt = (i, r) => { const a = -Math.PI / 2 + i * Math.PI * 2 / 5; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; };
  c.strokeStyle = '#ffffff30'; c.lineWidth = 2;
  for (let lv = 1; lv <= 5; lv++) { c.beginPath(); for (let i = 0; i < 5; i++) c.lineTo(...pt(i, R * lv / 5)); c.closePath(); c.stroke(); }
  for (let i = 0; i < 5; i++) { c.beginPath(); c.moveTo(cx, cy); c.lineTo(...pt(i, R)); c.stroke(); }
  if (eff && eff.some((v, i) => v !== st[i])) {
    c.beginPath(); for (let i = 0; i < 5; i++) c.lineTo(...pt(i, R * Math.min(eff[i], 12) / 10)); c.closePath();
    c.fillStyle = '#ffb30055'; c.fill(); c.strokeStyle = '#ffd54a'; c.lineWidth = 3; c.stroke();
  }
  c.beginPath(); for (let i = 0; i < 5; i++) c.lineTo(...pt(i, R * st[i] / 10)); c.closePath();
  c.fillStyle = '#3b82f688'; c.fill(); c.strokeStyle = '#60e0ff'; c.lineWidth = 3; c.stroke();
  c.fillStyle = '#cfe0f5'; c.font = '24px Jua'; c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let i = 0; i < 5; i++) { const [x, y] = pt(i, R + 26); c.fillText(STAT_NAMES[i], x, y); }
}

/* ───────────── 메인 루프 ───────────── */
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  updateMusic();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.__g = () => G;
</script>
